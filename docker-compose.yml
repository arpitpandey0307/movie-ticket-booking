version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: movie-booking-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: movie_booking
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: movie-booking-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # Uncomment to run backend in Docker
  # api:
  #   build:
  #     context: ./apps/api
  #     dockerfile: Dockerfile
  #   container_name: movie-booking-api
  #   ports:
  #     - '4000:4000'
  #   environment:
  #     DATABASE_URL: postgresql://postgres:postgres@postgres:5432/movie_booking
  #     REDIS_HOST: redis
  #     REDIS_PORT: 6379
